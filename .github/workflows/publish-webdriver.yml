name: publish-webdriver

on:
  push:
    tags:
      - "webdriver/chrome-[0-9]+-min"
      - "webdriver/chrome-[0-9]+"
      - "webdriver/firefox-[0-9]+-min"
      - "webdriver/firefox-[0-9]+"
      - "webdriver/msedge-[0-9]+-min"
      - "webdriver/msedge-[0-9]+"
  workflow_dispatch:
    inputs:
      browser:
        description: "chrome | firefox | msedge | all (all = every pin major, ~40 min)"
        required: false
        default: all
        type: choice
        options:
          - all
          - chrome
          - firefox
          - msedge
      major:
        description: "Major (empty/all = every pin major for the browser)"
        required: false
        default: all
      variant:
        description: "warm | min | both"
        required: false
        default: both
        type: choice
        options:
          - both
          - warm
          - min

concurrency:
  # Per-ref so tag publishes (msedge-151 vs 151-min vs 150) do not pending-cancel
  # each other. Shared "browser-image-publish" dropped every tag except the last.
  group: browser-image-webdriver-${{ github.ref }}
  cancel-in-progress: false

jobs:
  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Resolve chrome major and variant
        id: version
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            browser="${{ inputs.browser }}"
            major="${{ inputs.major }}"
            variant="${{ inputs.variant }}"
            browser="${browser:-all}"
            major="${major:-all}"
            variant="${variant:-both}"
            echo "variant=${variant}" >> "$GITHUB_OUTPUT"
            echo "browser=${browser}" >> "$GITHUB_OUTPUT"
            echo "major=${major}" >> "$GITHUB_OUTPUT"
            if [[ "${browser}" == "all" || "${major}" == "all" || -z "${major}" ]]; then
              echo "mode=all" >> "$GITHUB_OUTPUT"
            else
              echo "mode=one" >> "$GITHUB_OUTPUT"
            fi
          else
            ref="${GITHUB_REF#refs/tags/}"
            ref="${ref#webdriver/}"
            browser="chrome"
            if [[ "${ref}" == firefox-* ]]; then
              browser="firefox"
              ref="${ref#firefox-}"
            elif [[ "${ref}" == msedge-* ]]; then
              browser="msedge"
              ref="${ref#msedge-}"
            else
              ref="${ref#chrome-}"
            fi
            echo "browser=${browser}" >> "$GITHUB_OUTPUT"
            if [[ "${ref}" == *-min ]]; then
              echo "variant=min" >> "$GITHUB_OUTPUT"
              ref="${ref%-min}"
            else
              echo "variant=warm" >> "$GITHUB_OUTPUT"
            fi
            echo "mode=one" >> "$GITHUB_OUTPUT"
            echo "major=${ref}" >> "$GITHUB_OUTPUT"
          fi

      - name: Build and push webdriver images
        run: |
          chmod +x webdriver/scripts/push.sh
          if [[ "${{ steps.version.outputs.mode }}" == "all" ]]; then
            if [[ "${{ steps.version.outputs.browser }}" == "all" || -z "${{ steps.version.outputs.browser }}" ]]; then
              ./webdriver/scripts/push.sh all all "${{ steps.version.outputs.variant }}"
            else
              ./webdriver/scripts/push.sh "${{ steps.version.outputs.browser }}" all "${{ steps.version.outputs.variant }}"
            fi
          else
            ./webdriver/scripts/push.sh "${{ steps.version.outputs.browser }}" "${{ steps.version.outputs.major }}" "${{ steps.version.outputs.variant }}"
          fi

  release:
    name: Create GitHub release (webdriver)
    needs: docker
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7

      - name: Resolve release tag
        id: tag
        run: |
          ref="${GITHUB_REF#refs/tags/}"
          echo "tag=${ref}" >> "$GITHUB_OUTPUT"
          display="${ref#webdriver/}"
          echo "name=WebDriver ${display}" >> "$GITHUB_OUTPUT"

      - name: Generate release notes
        run: |
          chmod +x webdriver/scripts/release-notes.sh
          ./webdriver/scripts/release-notes.sh "${GITHUB_REF#refs/tags/}" > release-notes.md

      - uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ steps.tag.outputs.tag }}
          name: ${{ steps.tag.outputs.name }}
          body_path: release-notes.md
          make_latest: false

  smoke-meta:
    name: Resolve smoke dispatch metadata
    needs: docker
    if: success()
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      source_browser: ${{ steps.version.outputs.browser }}
      webdriver_variant: ${{ steps.version.outputs.variant }}
    steps:
      - uses: actions/checkout@v7
      - name: Resolve version
        id: version
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            # Manual publish — cheap 01 min slice against pin default chrome major.
            echo "browser=chrome" >> "$GITHUB_OUTPUT"
            echo "variant=min" >> "$GITHUB_OUTPUT"
            echo "version=$(python3 scripts/pin_get.py chrome.default_major)" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          ref="${GITHUB_REF#refs/tags/}"
          ref="${ref#webdriver/}"
          browser="chrome"
          if [[ "${ref}" == firefox-* ]]; then
            browser="firefox"
            ref="${ref#firefox-}"
          elif [[ "${ref}" == msedge-* ]]; then
            browser="msedge"
            ref="${ref#msedge-}"
          else
            ref="${ref#chrome-}"
          fi
          variant="warm"
          if [[ "${ref}" == *-min ]]; then
            variant="min"
            ref="${ref%-min}"
          fi
          echo "browser=${browser}" >> "$GITHUB_OUTPUT"
          echo "variant=${variant}" >> "$GITHUB_OUTPUT"
          echo "version=${ref}" >> "$GITHUB_OUTPUT"

  deploy-smoke:
    name: Publish smoke → selenoid-tests (webdriver)
    needs: smoke-meta
    if: success()
    permissions:
      actions: read
      contents: read
    uses: ./.github/workflows/smoke-trigger-callback.yml
    secrets:
      SELENOID_TESTS_DISPATCH_TOKEN: ${{ secrets.SELENOID_TESTS_DISPATCH_TOKEN }}
    with:
      env_profile: selenoid_github_e2e
      test_tags: smoke
      source_variant: webdriver
      source_browser: ${{ needs.smoke-meta.outputs.source_browser }}
      webdriver_variant: ${{ needs.smoke-meta.outputs.webdriver_variant }}
      source_version: ${{ needs.smoke-meta.outputs.version }}
      source_ref: ${{ github.ref }}
      summary_title: Publish smoke → selenoid-tests (webdriver)

  promote-prod:
    name: Pull browsers on prod → selenoid.qa.guru
    needs: docker
    # Tag publishes are owned by watch.yml (Hub 200 → catalog / pull-prod).
    # workflow_dispatch keeps a manual pull without waiting for cron.
    if: success() && github.event_name == 'workflow_dispatch'
    permissions:
      contents: read
    uses: ./.github/workflows/deploy-prod-dispatch.yml
    secrets:
      SELENOID_TESTS_DISPATCH_TOKEN: ${{ secrets.SELENOID_TESTS_DISPATCH_TOKEN }}
    with:
      pull_browsers: always
      skip_inline_browser_smoke: true
